# Strict SQL Verification & Privacy Rules
safety_and_verification:
  allowed_statements: ["SELECT"]
  privacy_rules:
    - "Never expose student_id, student names, phone numbers, or email addresses in final output."
    - "Aggregate queries only: results with group size < 3 should be suppressed or flagged with low confidence."
  sanity_checks:
    - "Percentage values must always be between 0.0 and 100.0."
    - "Branch total placed students must never exceed total registered students in that branch."
    - "Branch offers count can exceed placed students count (due to multi-offers)."
    - "Median package must be <= Highest package and >= Lowest package."
    - "Stipend values (e.g. 45000 INR/mo) must never appear in ctc_lpa columns (which are in LPA)."

